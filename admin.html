<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rokori BR — Painel Admin</title>
<style>
:root{--green:#39ff14;--bg:#030603;--card:#091009;--line:#1d3b1d;--muted:#93a193;--yellow:#ffd84d;--red:#ff6262}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#174517 0,#050905 45%,#020302 100%);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{width:min(1150px,94%);margin:28px auto 50px}.card{background:rgba(9,16,9,.94);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 10px 35px #0008}.login{max-width:440px;margin:12vh auto;text-align:center}.logo{font-size:30px;font-weight:900;letter-spacing:1px}.logo span{color:var(--green)}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #315331;background:#030603;color:#fff;margin:12px 0;font-size:16px;outline:none}.input:focus{border-color:var(--green);box-shadow:0 0 0 3px #39ff1422}button{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer;background:var(--green);color:#031003;transition:.15s}button:hover{transform:translateY(-1px);filter:brightness(1.08)}button.secondary{background:#172217;color:#fff;border:1px solid #315331}.danger{background:#c93636;color:#fff}.hidden{display:none}.muted{color:var(--muted)}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.head h1{margin:0;margin-right:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat{background:#050905;border:1px solid var(--line);border-radius:14px;padding:15px}.stat b{display:block;font-size:25px;margin-bottom:4px}.stat span{color:var(--muted);font-size:13px}.app{border:1px solid #203d20;border-radius:18px;padding:20px;margin:15px 0;background:linear-gradient(145deg,#091109,#050905)}.app h2{margin:0 0 5px;font-size:22px}.status{font-weight:900;padding:5px 9px;border-radius:999px;font-size:12px}.pending{color:var(--yellow);background:#ffd84d14}.approved{color:var(--green);background:#39ff1414}.rejected{color:var(--red);background:#ff626214}.meta{color:#7f8c7f;font-size:12px}.question{margin:14px 0;padding:12px;border-radius:12px;background:#040804;border:1px solid #162816}.question b{display:block;margin-bottom:6px;color:#cceacc}.answers{white-space:pre-wrap;line-height:1.5;color:#e8eee8}.toolbar{margin-top:15px}.empty{text-align:center;padding:30px}.error{color:#ff8080;min-height:20px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{width:94%;margin-top:15px}.card,.app{padding:16px}.head h1{width:100%;margin-bottom:4px}.toolbar button{flex:1}.app .row button{flex:1;min-width:105px}}
</style>
</head>
<body>
<main class="wrap">
<section id="login" class="card login">
  <div class="logo">ROKORI <span>BR</span></div>
  <h2>🛡️ Painel Administrativo</h2>
  <p class="muted">Acesso restrito à administração.</p>
  <input id="password" class="input" type="password" placeholder="Digite a senha do painel" autocomplete="current-password">
  <button onclick="login()" style="width:100%">Entrar no painel</button>
  <p id="loginError" class="error"></p>
</section>

<section id="panel" class="hidden">
  <div class="card head">
    <div class="row">
      <h1>🛡️ Candidaturas</h1>
      <button class="secondary" onclick="loadApps()">↻ Atualizar</button>
      <button class="danger" onclick="logout()">Sair</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="total">0</b><span>Total</span></div>
      <div class="stat"><b id="pending">0</b><span>Pendentes</span></div>
      <div class="stat"><b id="approved">0</b><span>Aprovadas</span></div>
      <div class="stat"><b id="rejected">0</b><span>Recusadas</span></div>
    </div>
  </div>
  <div id="apps"></div>
</section>
</main>

<script>
let password='';

document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

async function login(){
  password=document.getElementById('password').value.trim();
  if(!password){document.getElementById('loginError').textContent='Digite a senha.';return}
  const ok=await loadApps();
  if(ok){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
  }
}

async function loadApps(){
  try{
    const r=await fetch('/api/applications',{headers:{'x-admin-password':password}});
    if(r.status===401){
      document.getElementById('loginError').textContent='Senha incorreta.';
      return false;
    }
    if(!r.ok)throw new Error();
    const apps=await r.json();
    render(apps);
    return true;
  }catch(e){
    document.getElementById('loginError').textContent='Erro ao conectar ao servidor.';
    return false;
  }
}

function esc(v){
  return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
function statusClass(s){return s==='Aprovada'?'approved':s==='Recusada'?'rejected':'pending'}

function render(apps){
  const p=apps.filter(a=>a.status==='Pendente').length;
  const ap=apps.filter(a=>a.status==='Aprovada').length;
  const r=apps.filter(a=>a.status==='Recusada').length;
  document.getElementById('total').textContent=apps.length;
  document.getElementById('pending').textContent=p;
  document.getElementById('approved').textContent=ap;
  document.getElementById('rejected').textContent=r;

  document.getElementById('apps').innerHTML=apps.length?apps.map(a=>`
  <article class="app">
    <div class="row">
      <h2>${esc(a.nick)}</h2>
      <span class="status ${statusClass(a.status)}">${esc(a.status)}</span>
      <span class="meta">${new Date(a.submittedAt).toLocaleString('pt-BR')}</span>
    </div>

    <div class="question"><b>👤 Dados</b>
      Discord: ${esc(a.discord)}<br>
      ID do Discord: ${esc(a.discordId||'não informado')}<br>
      Idade: ${esc(a.age)}<br>
      Tempo disponível: ${esc(a.time)}
    </div>

    <div class="question"><b>🎮 Experiência</b><div class="answers">${esc(a.experience)}</div></div>
    <div class="question"><b>🛡️ Por que quer ser Admin?</b><div class="answers">${esc(a.why)}</div></div>
    <div class="question"><b>⚔️ Como lidaria com uma discussão?</b><div class="answers">${esc(a.conflict)}</div></div>
    <div class="question"><b>👥 E se um amigo quebrasse uma regra?</b><div class="answers">${esc(a.friend)}</div></div>
    <div class="question"><b>⭐ Por que devemos escolher você?</b><div class="answers">${esc(a.choose)}</div></div>
    <div class="question"><b>🕒 Disponibilidade</b><div class="answers">${esc(a.availability)}</div></div>
    <div class="question"><b>📜 Segue as regras?</b><div class="answers">${esc(a.rules)}</div></div>

    <div class="row toolbar">
      <button onclick="setStatus('${esc(a.id)}','Aprovada')">✅ Aprovar</button>
      <button onclick="setStatus('${esc(a.id)}','Recusada')">❌ Recusar</button>
      <button class="secondary" onclick="setStatus('${esc(a.id)}','Pendente')">⏳ Pendente</button>
      <button class="danger" onclick="removeApp('${esc(a.id)}')">🗑️ Excluir</button>
    </div>
  </article>`).join(''):'<div class="card empty"><h2>Nenhuma candidatura ainda.</h2><p class="muted">Quando alguém enviar uma candidatura, ela aparecerá aqui.</p></div>';
}

async function setStatus(id,status){
  if(status==='Aprovada'&&!confirm('Aprovar esta candidatura? O servidor também tentará entregar o cargo configurado no Discord.'))return;
  if(status==='Recusada'&&!confirm('Recusar esta candidatura?'))return;
  try{
    const r=await fetch('/api/applications/'+encodeURIComponent(id),{
      method:'PATCH',
      headers:{'Content-Type':'application/json','x-admin-password':password},
      body:JSON.stringify({status})
    });
    const result=await r.json().catch(()=>({}));
    if(!r.ok){alert(result.error||'Não foi possível alterar o status.');return}
    await loadApps();
  }catch(e){alert('Erro de conexão com o servidor.')}
}

async function removeApp(id){
  if(!confirm('Excluir esta candidatura permanentemente?'))return;
  const r=await fetch('/api/applications/'+encodeURIComponent(id),{method:'DELETE',headers:{'x-admin-password':password}});
  if(!r.ok){alert('Não foi possível excluir.');return}
  loadApps();
}

function logout(){
  password='';
  document.getElementById('password').value='';
  document.getElementById('loginError').textContent='';
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
}
</script>
</body>
</html>
