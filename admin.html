<style>
:root{--g:#39ff14;--bg:#050805;--card:#0b110b;--muted:#9aa49a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#153915,#020302 60%);color:#fff;font-family:Arial,sans-serif}.wrap{width:min(1100px,94%);margin:30px auto}.card{background:#0b110b;border:1px solid #1c351c;border-radius:18px;padding:22px;margin-bottom:18px}h1{margin-top:0}.login{max-width:430px;margin:12vh auto}.input{width:100%;padding:13px;border-radius:10px;border:1px solid #294329;background:#050805;color:#fff;margin:8px 0 12px}button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:var(--g);color:#031003}.danger{background:#d33;color:#fff}.muted{color:var(--muted)}.hidden{display:none}.app{border:1px solid #223922;border-radius:14px;padding:18px;margin:14px 0;background:#080d08}.answers{white-space:pre-wrap;line-height:1.45}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{font-weight:800}.pending{color:#ffd84d}.approved{color:#39ff14}.rejected{color:#ff6b6b}small{color:#7f887f}

body{min-height:100vh}
.gate,.b-reaction{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.18)}
.gate-card{width:min(560px,94vw);padding:28px;text-align:center;background:rgba(5,8,5,.9);border:1px solid rgba(57,255,20,.55);border-radius:22px;box-shadow:0 0 35px rgba(57,255,20,.16),0 18px 60px rgba(0,0,0,.55)}
.reaction{display:block;width:min(260px,70vw);margin:0 auto 18px;border-radius:14px}
.gate-badge{color:#39ff14;font-weight:900;letter-spacing:1px;margin-bottom:12px}
.gate-card h1{font-size:clamp(22px,5vw,34px);margin:0 0 10px}
.gate-sub{color:#c3cbc3;margin:0 0 24px}
.gate-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.gate-buttons button{min-width:220px;padding:14px 18px;font-size:15px;border-radius:12px}
.gate-buttons .no{background:#d33;color:#fff}
.b-reaction{background:#000}
#bVideo{width:min(700px,96vw);max-height:90vh;object-fit:contain;border-radius:16px;cursor:pointer}
.hidden{display:none !important}

    <div class="gate-badge">🔐 ROKORI BR</div>
    <h1>VC ACHA A CO-OWNER AYLA LEGAL?</h1>
    <p class="gate-sub">Responda para continuar para o painel.</p>
    <div class="gate-buttons">
      <button class="yes" onclick="answerYes()">A) Sim, óbvio</button>
      <button class="no" onclick="answerNo()">B) Nunca KKKKKKKK</button>
    </div>
  </div>
</div>

<div id="bReaction" class="b-reaction hidden">
  <video id="bVideo" src="gato-b.mp4" autoplay loop playsinline></video>
</div>

<div id="login" class="card login hidden"><h1>🛡️ Rokori BR</h1><p class="muted">Painel de candidaturas administrativas.</p><input id="password" class="input" type="password" placeholder="Senha do painel"><button onclick="login()">Entrar</button><p id="loginError" class="muted"></p></div>
<div id="panel" class="hidden"><div class="card"><div class="row"><h1 style="margin-right:auto">Candidaturas</h1><button onclick="loadApps()">Atualizar</button><button class="danger" onclick="logout()">Sair</button></div><p id="count" class="muted"></p></div><div id="apps"></div></div>
</main><script>
let password='';
function login(){password=document.getElementById('password').value;if(!password)return;loadApps().then(ok=>{if(ok){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden')}})}
async function loadApps(){try{const r=await fetch('/api/applications',{headers:{'x-admin-password':password}});if(r.status===401){document.getElementById('loginError').textContent='Senha incorreta.';return false}const apps=await r.json();render(apps);return true}catch(e){document.getElementById('loginError').textContent='Erro ao conectar ao servidor.';return false}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(apps){document.getElementById('count').textContent=`${apps.length} candidatura(s) recebida(s)`;document.getElementById('apps').innerHTML=apps.length?apps.map(a=>`<article class="app"><div class="row"><h2>${esc(a.nick)}</h2><span class="status ${a.status==='Aprovada'?'approved':a.status==='Recusada'?'rejected':'pending'}">${esc(a.status)}</span><small>${new Date(a.submittedAt).toLocaleString('pt-BR')}</small></div><p><b>Discord:</b> ${esc(a.discord)} &nbsp; <b>Idade:</b> ${esc(a.age)} &nbsp; <b>Tempo:</b> ${esc(a.time)}</p><p><b>Experiência:</b> ${esc(a.experience)}<br><b>Disponibilidade:</b> ${esc(a.availability)}<br><b>Segue regras:</b> ${esc(a.rules)}</p><p><b>Por que quer ser Admin?</b><br><span class="answers">${esc(a.why)}</span></p><p><b>Discussão entre membros:</b><br><span class="answers">${esc(a.conflict)}</span></p><p><b>Amigo quebrando regra:</b><br><span class="answers">${esc(a.friend)}</span></p><p><b>Por que escolher você?</b><br><span class="answers">${esc(a.choose)}</span></p><div class="row"><button onclick="setStatus('${a.id}','Aprovada')">Aprovar</button><button onclick="setStatus('${a.id}','Recusada')">Recusar</button><button onclick="setStatus('${a.id}','Pendente')">Pendente</button><button class="danger" onclick="removeApp('${a.id}')">Excluir</button></div></article>`).join(''):'<div class="card"><p>Nenhuma candidatura ainda.</p></div>'}
async function setStatus(id,status){await fetch('/api/applications/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-password':password},body:JSON.stringify({status})});loadApps()}
async function removeApp(id){if(!confirm('Excluir esta candidatura?'))return;await fetch('/api/applications/'+id,{method:'DELETE',headers:{'x-admin-password':password}});loadApps()}
function logout(){password='';document.getElementById('panel').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}

function answerYes(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('password').focus();
}
function answerNo(){
  document.getElementById('gate').classList.add('hidden');
  const box=document.getElementById('bReaction');
  box.classList.remove('hidden');
  document.getElementById('bVideo').currentTime=0;
  document.getElementById('bVideo').play().catch(()=>{});
}
document.getElementById('bVideo').addEventListener('click',function(){
  this.pause();
  document.getElementById('bReaction').classList.add('hidden');
  document.getElementById('gate').classList.remove('hidden');
});
</script></body></html>
